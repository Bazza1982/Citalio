name: CI
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      full:
        description: Run all retained checks for a stable major/cross-domain candidate
        type: boolean
        required: false
        default: true
jobs:
  ci-plan:
    name: Select necessary checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      product: ${{ steps.scope.outputs.product }}
      full: ${{ steps.scope.outputs.full }}
      linux_os: ${{ steps.scope.outputs.linux_os }}
      python_versions: ${{ steps.scope.outputs.python_versions }}
      node_versions: ${{ steps.scope.outputs.node_versions }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify selection and failure contracts
      run: python -B -m unittest discover -s .github -p test_ci_plan.py -q
    - name: Select checks from actual impact
      id: scope
      run: python .github/ci_plan.py plan
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.ci-plan.outputs.python_versions) }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package and test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev,word,gui,mcp]"
    - name: Run tests
      run: python .github/ci_plan.py test product
    - name: CLI smoke test
      run: |-
        citalio --help
        tmp=$(mktemp -d)
        citalio init --library "$tmp/lib"
        citalio db status --library "$tmp/lib"
        citalio db backup --library "$tmp/lib" --label ci-smoke
        citalio import csl-json --library "$tmp/lib" --file tests/fixtures/sample_csl.json
        citalio refs search --library "$tmp/lib" "demo"
    needs:
    - ci-plan
    if: ${{ needs.ci-plan.result == 'success' && needs.ci-plan.outputs.product == 'true' }}
  ci-result:
    name: CI result
    if: ${{ always() }}
    needs:
    - ci-plan
    - test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Require actual success of every selected check
      env:
        CI_NEEDS: ${{ toJSON(needs) }}
      run: python .github/ci_plan.py summary --jobs '{"test":"product"}'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
