[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citalio"
version = "0.1.0"
description = "Standalone PhD-scale citation and reference management system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "openpyxl>=3.1",
    "bibtexparser>=1.4",
]

[project.optional-dependencies]
gui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
mcp = [
    "mcp>=1.0",
]
word = [
    "python-docx>=1.1",
]
semantic = [
    # FlagEmbedding pulls in torch + transformers; model (~1.2 GB) downloads
    # automatically from HuggingFace on first use.
    "FlagEmbedding>=1.2",
    "numpy>=1.24",
]
zotero = []
crossref = [
    "httpx>=0.27",
]
openalex = [
    "httpx>=0.27",
]
library = [
    "httpx>=0.27",
]
llm = []
all = [
    "citalio[gui,mcp,crossref,openalex,library,llm,word]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fastapi>=0.110",
]

[project.scripts]
citalio = "citalio.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["citalio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
